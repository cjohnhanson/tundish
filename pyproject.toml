[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "tundish"
description = "A local inbox that agents subscribe to"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/cjohnhanson/tundish"

[project.scripts]
tundish = "tundish._cli:main"

[tool.maturin]
# An extension module, not bin bindings: Python code imports
# tundish.publish, and the command runs the same Rust CLI through it.
bindings = "pyo3"
features = ["python", "pyo3/extension-module", "pyo3/abi3-py310"]
module-name = "tundish._native"
python-source = "python"

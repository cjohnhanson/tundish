doc: |
  reader acked item 1 at 1003. The inspection transitions change
  nothing, so they all end in one terminal state.
transitions:
  - name: "a second subscriber's ack exits 3 and names the owner"
    command: "tundish --now 1004 subscribe inbox --as other && tundish --now 1004 ack 1 --as other; echo \"exit $?\""
    target: "../ack-taken"
    stdout: "already acked by reader at 1003\nexit 3\n"
  - name: "a repeat ack by the owner still succeeds"
    command: "tundish --now 1004 ack 1 --as reader"
    target: "../inspected"
    stdout: "acked 1\n"
  - name: "show prints the item as JSON"
    command: "tundish show 1"
    target: "../inspected"
    stdout: "{\n  \"id\": 1,\n  \"queue\": \"slack\",\n  \"key\": \"C1\",\n  \"payload\": {\n    \"text\": \"hi\"\n  },\n  \"created_at\": 1001,\n  \"acked_by\": \"reader\"\n}\n"
  - name: "list prints each queue and its count"
    command: "tundish list"
    target: "../inspected"
    stdout: "slack\t1\n"
  - name: "list of a queue prints one JSON item per line"
    command: "tundish list slack"
    target: "../inspected"
    stdout: "{\"id\":1,\"queue\":\"slack\",\"key\":\"C1\",\"payload\":{\"text\":\"hi\"},\"created_at\":1001,\"acked_by\":\"reader\"}\n"
  - name: "list --unacked leaves out the acked item"
    command: "tundish list slack --unacked"
    target: "../inspected"
    stdout: ""
  - name: "status prints the subscriber's position"
    command: "tundish status"
    target: "../inspected"
    stdout: "inbox\treader\tqueue=slack\tcursor=1\tunread=0\tnext_at=0\tdropped=0\n"
  - name: "check accepts the subscription"
    command: "tundish check"
    target: "../inspected"
    stdout: "ok\n"
  - name: "a pull after the ack prints nothing"
    command: "tundish --now 1005 pull inbox --as reader"
    target: "../inspected"
    stdout: ""

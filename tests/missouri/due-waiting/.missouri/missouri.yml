doc: |
  Item 2 waits for the window to pass.
transitions:
  - name: "pull --due after the window delivers the waiting item"
    command: "tundish --now 4700 pull --due --as bot"
    target: "../due-again"
    stdout: "tundish: subscription=digest subscriber=bot delivered=1 more=0 unacked=0 parked=0 errors=0 dropped=0 lease=0\n[news#2] {\"n\":2}\n"

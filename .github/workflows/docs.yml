# The docs checks every family tool shares, kept in the diataxis
# repository so there is one copy: every tundish command sits in a
# `console` block that `cargo test --test docs` runs, every fence names a
# language, the README keeps the family shape, links resolve, and typos
# finds no misspelling. This file is not generated by gaff.
name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  family:
    uses: cjohnhanson/diataxis/.github/workflows/family-checks.yml@main
    with:
      tool: tundish

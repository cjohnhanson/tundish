# The docs checks the eng.rip tools share, called from the diataxis
# repository so there is one copy of them. CONTRIBUTING.md ("The docs are
# tests") lists what they fail. This file is not generated by gaff: gaff
# writes jobs made of steps, and a reusable workflow is called by a job.
name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  family:
    uses: cjohnhanson/diataxis/.github/workflows/family-checks.yml@main
    with:
      tool: tundish

[package]
name = "tundish"
version = "0.1.1"
edition = "2024"
# 1.88: the code uses let-chains.
rust-version = "1.88"
description = "A local inbox that agents subscribe to"
license = "MIT"
repository = "https://github.com/cjohnhanson/tundish"
homepage = "https://github.com/cjohnhanson/tundish"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["queue", "inbox", "agents", "sqlite", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["npm/", "python/", "pyproject.toml", "tests/", ".github/", ".gaff/", ".tisket/", ".agents/", "scripts/", "homebrew/", "flake.nix", "flake.lock", "almanac.yml"]

[lib]
# rlib for the binary and the tests; cdylib for the Python module.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "tundish"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
diataxis = { version = "0.1", default-features = false, features = ["cli"] }
jaq-core = "3.1"
jaq-json = "2.0"
jaq-std = "3.0"
mdstore = { version = "0.5", package = "mdstore-core" }
pyo3 = { version = "0.30", optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2"
yaml_serde = "0.10"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3.27.0"

[build-dependencies]
diataxis = { version = "0.1", default-features = false, features = ["build"] }

[features]
# The Python module, built by maturin. Off for the crate and the binary.
python = ["dep:pyo3"]

[package.metadata.deb]
maintainer = "cjohnhanson <cody@codyjhanson.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "A local inbox that agents subscribe to"
assets = [
    ["target/release/tundish", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tundish/README", "644"],
    ["LICENSE", "usr/share/doc/tundish/LICENSE", "644"],
]
